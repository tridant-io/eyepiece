[package]
name = "eyepiece"
version = "0.1.0"
edition = "2021"
publish = false
description = "a review player for vfx and install content"

# the gate programs under spike/ are their own packages and are never built with the player
[workspace]
exclude = ["spike"]

[dependencies]
cpal = "0.18.2"
egui = { version = "0.37.0", default-features = false }
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat", "swresample"] }
png = "0.18.1"
signalsmith-stretch = "0.1.3"
snap = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
