[package]
name = "eyepiece"
version = "0.3.1"
edition = "2021"
publish = false
description = "a video review player for video professionals: extremely fast, lightweight, and only what you need"
license = "CPAL-1.0"

# the gate programs under spike/ are their own packages and are never built with the player
[workspace]
exclude = ["spike"]

[dependencies]
cpal = "0.18.2"
egui = { version = "0.37.0", default-features = false }
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat", "swresample"] }
png = "0.18.1"
signalsmith-stretch = "0.1.3"
snap = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface", "block2"] }
objc2-quartz-core = "0.3"

[profile.release]
opt-level = 3
