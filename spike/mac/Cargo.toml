[package]
name = "spike-mac"
version = "0.0.0"
edition = "2021"
publish = false
description = "throwaway phase 0 gate programs for macos. not the player."

[dependencies]
spike = { path = ".." }
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"

[profile.release]
opt-level = 3
